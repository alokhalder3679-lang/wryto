    <script>
      (function () {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, "fetch", {
            get: function () {
              return _fetch;
            },
            set: function (newFetch) {
              _fetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {}

        try {
          if (typeof Window !== "undefined" && Window.prototype) {
            var desc = Object.getOwnPropertyDescriptor(Window.prototype, "fetch");
            if (desc && !desc.set) {
              var _protoFetch = desc.get ? desc.get.call(window) : window.fetch;
              Object.defineProperty(Window.prototype, "fetch", {
                get: function () {
                  return _protoFetch;
                },
                set: function (newFetch) {
                  _protoFetch = newFetch;
                },
                configurable: true,
                enumerable: true,
              });
            }
          }
        } catch (e) {}
      })();
    </script>
